name: tktours-concierge

services:
  volume-init:
    build:
      context: .
      target: runtime
    user: "0:0"
    entrypoint:
      - /bin/sh
      - -c
    command:
      - >-
        mkdir -p /app/storage/resources
        && chown -R app:app /app/storage/resources
    volumes:
      - resources:/app/storage/resources
    restart: "no"

  api:
    build:
      context: .
      target: runtime
    image: tktours-concierge-backend:local
    container_name: tktours-concierge-backend
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 4001
      RESOURCES_STORAGE_DIR: /app/storage/resources
    ports:
      - "127.0.0.1:${HOST_PORT:-4001}:4001"
    volumes:
      - resources:/app/storage/resources
    depends_on:
      volume-init:
        condition: service_completed_successfully
    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4001/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

  migrate:
    profiles: [migrate]
    build:
      context: .
      target: migrations
    env_file:
      - .env
    environment:
      NODE_ENV: production
    restart: "no"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:mode=1777,size=64m

volumes:
  resources:
    external: true
    name: tktours-concierge-resources
